<link rel="stylesheet" href="css/resumen.css">
<div class="resume-board-container">
    <div class="kpi-grid">
        
        <div class="kpi-card">
            <div class="kpi-header">
                <span class="kpi-title">Guías Generadas</span>
                <div class="kpi-icon-wrapper icon-blue">
                    <i data-lucide="package"></i>
                </div>
            </div>
            <div class="kpi-body">
                <h3 class="kpi-value">1,248</h3>
                <p class="kpi-subtext positive">▲ +12% este mes</p>
            </div>
        </div>

        <div class="kpi-card">
            <div class="kpi-header">
                <span class="kpi-title">Cotizaciones Activas</span>
                <div class="kpi-icon-wrapper icon-orange">
                    <i data-lucide="calculator"></i>
                </div>
            </div>
            <div class="kpi-body">
                <h3 class="kpi-value">42</h3>
                <p class="kpi-subtext positive">▲ +5 nuevas hoy</p>
            </div>
        </div>

        <div class="kpi-card">
            <div class="kpi-header">
                <span class="kpi-title">Usuarios en Sistema</span>
                <div class="kpi-icon-wrapper icon-green">
                    <i data-lucide="users"></i>
                </div>
            </div>
            <div class="kpi-body">
                <h3 class="kpi-value">18</h3>
                <p class="kpi-subtext neutral">● Operando normal</p>
            </div>
        </div>

    </div>
</div>
